<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f23"/>
      <stop offset="100%" style="stop-color:#1a1a3e"/>
    </linearGradient>
    <linearGradient id="zapier" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff4a00"/>
      <stop offset="100%" style="stop-color:#ff6b35"/>
    </linearGradient>
    <linearGradient id="docuqueue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="400" fill="url(#bg)"/>
  
  <!-- Grid pattern -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#2a2a4a" stroke-width="0.5"/>
  </pattern>
  <rect width="800" height="400" fill="url(#grid)"/>
  
  <!-- App icons -->
  <!-- Google Forms -->
  <g transform="translate(80, 150)">
    <rect x="0" y="0" width="80" height="80" rx="16" fill="#7c3aed"/>
    <text x="40" y="35" text-anchor="middle" fill="white" font-family="Arial" font-size="12" font-weight="bold">Forms</text>
    <text x="40" y="55" text-anchor="middle" fill="#a5b4fc" font-family="Arial" font-size="10">Google</text>
  </g>
  
  <!-- Stripe -->
  <g transform="translate(80, 260)">
    <rect x="0" y="0" width="80" height="80" rx="16" fill="#635bff"/>
    <text x="40" y="35" text-anchor="middle" fill="white" font-family="Arial" font-size="12" font-weight="bold">Stripe</text>
    <text x="40" y="55" text-anchor="middle" fill="#a5b4fc" font-family="Arial" font-size="10">Payments</text>
  </g>
  
  <!-- Zapier -->
  <g transform="translate(300, 170)">
    <rect x="0" y="0" width="100" height="100" rx="20" fill="url(#zapier)"/>
    <text x="50" y="45" text-anchor="middle" fill="white" font-family="Arial" font-size="14" font-weight="bold">⚡</text>
    <text x="50" y="65" text-anchor="middle" fill="white" font-family="Arial" font-size="12" font-weight="bold">Zapier</text>
  </g>
  
  <!-- DocuQueue -->
  <g transform="translate(520, 170)">
    <rect x="0" y="0" width="100" height="100" rx="20" fill="url(#docuqueue)"/>
    <text x="50" y="45" text-anchor="middle" fill="white" font-family="Arial" font-size="14" font-weight="bold">📄</text>
    <text x="50" y="65" text-anchor="middle" fill="white" font-family="Arial" font-size="11" font-weight="bold">DocuQueue</text>
  </g>
  
  <!-- Output apps -->
  <!-- Gmail -->
  <g transform="translate(700, 100)">
    <rect x="0" y="0" width="80" height="80" rx="16" fill="#ea4335"/>
    <text x="40" y="35" text-anchor="middle" fill="white" font-family="Arial" font-size="12" font-weight="bold">Gmail</text>
    <text x="40" y="55" text-anchor="middle" fill="#fecaca" font-family="Arial" font-size="10">Email</text>
  </g>
  
  <!-- Drive -->
  <g transform="translate(700, 210)">
    <rect x="0" y="0" width="80" height="80" rx="16" fill="#0f9d58"/>
    <text x="40" y="35" text-anchor="middle" fill="white" font-family="Arial" font-size="12" font-weight="bold">Drive</text>
    <text x="40" y="55" text-anchor="middle" fill="#a7f3d0" font-family="Arial" font-size="10">Storage</text>
  </g>
  
  <!-- Arrows -->
  <path d="M 160 190 L 290 220" stroke="#6366f1" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M 160 300 L 290 220" stroke="#6366f1" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M 400 220 L 510 220" stroke="#ff6b35" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M 620 200 L 690 140" stroke="#8b5cf6" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M 620 240 L 690 250" stroke="#8b5cf6" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  
  <!-- Arrow marker -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#8b5cf6"/>
    </marker>
  </defs>
  
  <!-- Labels -->
  <text x="400" y="50" text-anchor="middle" fill="#a0a0b0" font-family="Arial" font-size="16" font-weight="bold">How DocuQueue + Zapier Works</text>
  <text x="400" y="380" text-anchor="middle" fill="#6b7280" font-family="Arial" font-size="12">Trigger → Zapier → DocuQueue → Output</text>
</svg>